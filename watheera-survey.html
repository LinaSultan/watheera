<head>

<title>WATHEERA Survey · استبيان وثيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A3D;--green:#0E7C66;--amber:#F2A93B;--red:#D64545;--mist:#E9EEF0;--ink:#2B3238}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);overflow:hidden;background:linear-gradient(#0a1c2a,#0F2A3D 45%,#1d4a66);padding-top:env(safe-area-inset-top,0px)}
.st{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.25}}
.moon{position:fixed;top:9%;inset-inline-start:10%;width:56px;height:56px;border-radius:50%;background:#F6E3A1;box-shadow:inset -8px -4px 0 #e9cf85,0 0 40px #f6e3a155}
.scene{position:fixed;left:0;bottom:56px;width:100%;height:30vh;direction:ltr}
.road{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--ink);border-top:4px solid #111b22;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.road i{position:absolute;top:24px;height:6px;width:40px;background:var(--amber);border-radius:3px;animation:l 2.4s linear infinite}
@keyframes l{to{transform:translateX(-140px)}}
#car{position:fixed;bottom:44px;width:150px;direction:ltr;transition:left 1.2s ease,transform .3s}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:10px;display:flex;gap:8px;z-index:9}
.top button{font-family:inherit;font-weight:700;font-size:13px;color:#fff;background:#ffffff1f;border:1.5px solid #ffffff55;border-radius:99px;padding:6px 14px;cursor:pointer;backdrop-filter:blur(6px)}
#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:54px 12px 110px;z-index:5;pointer-events:none}
#win>*{pointer-events:auto}
.hero{text-align:center;color:#fff;animation:up .5s}
.hero h1{font-family:Montserrat,sans-serif;font-size:clamp(44px,13vw,92px);margin:0;letter-spacing:2px;-webkit-text-stroke:2px #0a1c2a;paint-order:stroke fill;text-shadow:0 5px 0 #0a1c2a}
.hero p{font-size:clamp(15px,4vw,20px);margin:6px 0 22px;color:#cfe3ee}
.go,.pill{font-family:inherit;font-weight:900;font-size:16px;border:0;border-radius:99px;padding:10px 24px;cursor:pointer}
.go{background:var(--amber);color:var(--navy);font-size:20px;padding:14px 34px;box-shadow:0 6px 0 #b9761a;animation:pu 1.6s infinite}
@keyframes pu{50%{transform:scale(1.05)}}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b9761a}
.card{width:min(480px,100%);max-height:100%;display:flex;flex-direction:column;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px #000a;animation:up .35s}
@keyframes up{from{transform:translateY(22px);opacity:0}}
.hd{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 16px}
.hd.g{background:var(--green)}.hd small{display:block;color:#9fc3d6;font-size:12px}.hd.g small{color:#cdeee4}.hd b{font-size:18px}
.ring{width:46px;height:46px;background:#fff;border-radius:50%;flex:none}
.ill{background:var(--mist);padding:6px 0;text-align:center;flex:none}.ill svg{height:84px;max-width:100%}
.bd{padding:6px 18px 12px;overflow:auto;flex:1}.bd p{font-size:14px;line-height:1.7;margin:8px 0}
.q{margin:14px 0 8px;font-weight:900;font-size:15px;line-height:1.6}.q small{font-weight:500;color:#789}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:inherit;font-weight:700;font-size:14px;padding:8px 16px;background:#fff;border:2px solid #c8d3d9;border-radius:99px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--amber)}
.opt.on{background:var(--green);border-color:var(--green);color:#fff}.opt.on.m::before{content:"✓ "}
.scale{display:flex;gap:6px;direction:ltr}.scale .opt{flex:1;font-size:22px;padding:6px 0;border-radius:14px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:#789;margin-top:5px}
input[type=text],textarea{width:100%;font-family:inherit;font-size:15px;padding:9px 12px;border:2px solid #c8d3d9;border-radius:14px;background:#fafcfd}
input:focus,textarea:focus{outline:0;border-color:var(--green)}textarea{min-height:70px;resize:vertical}
.ft{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--mist)}
.pill.g{background:var(--green);color:#fff}.pill.w{background:#fff;color:var(--navy);border:2px solid #c8d3d9}.pill:disabled{opacity:.4;cursor:not-allowed}
.note{color:var(--green);font-weight:700}.ans{list-style:none;padding:0;margin:8px 0;font-size:13px;line-height:1.7}.ans li{border-bottom:1px dashed #c8d3d9;padding:4px 0}
</style>
</head>

'<svg viewBox="0 0 200 80"><path d="M25 80c0-18 13-26 30-26s30 8 30 26z" fill="#0F2A3D"/><circle cx="55" cy="34" r="21" fill="#0E7C66" stroke="#0F2A3D" stroke-width="2.5"/><circle cx="55" cy="36" r="12" fill="#e9b88a"/><circle cx="51" cy="35" r="1.6" fill="#0F2A3D"/><circle cx="59" cy="35" r="1.6" fill="#0F2A3D"/><path d="M51 41q4 3 8 0" stroke="#0F2A3D" stroke-width="1.5" fill="none"/><rect x="96" y="8" width="84" height="38" rx="7" fill="#fff" stroke="#0F2A3D" stroke-width="2.5"/><path d="M104 36q12-18 28-8t30-14" stroke="#0E7C66" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/><circle cx="104" cy="36" r="2.5" fill="#0F2A3D"/><circle cx="165" cy="16" r="4" fill="#D64545"/><circle cx="162" cy="62" r="14" fill="#D64545" stroke="#0F2A3D" stroke-width="2.5"/><text x="162" y="66" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">SOS</text></svg>'];
let lang='ar',step=-1,A={},sent=null,showAns=false,aboutOpen=false;
const $=s=>document.querySelector(s),T=o=>o[lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=S.reduce((n,s)=>n+s.qs.length,0);
const has=v=>v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length);
const pct=()=>{let n=0;S.forEach(s=>s.qs.forEach(q=>{if(has(A[q.id]))n++}));return Math.round(n/total*100)};
const valid=s=>S[s].qs.every(q=>q.opt||has(A[q.id]));
function ring(p){const c=2*Math.PI*16;return '<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#dbe3e7" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="#0E7C66" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="#0F2A3D">'+p+'</text></svg>'}
function qHTML(q){
 let h='<div class="q">'+T(q.q)+(q.opt?' <small>'+T(UI.opt)+'</small>':'')+'</div>';
 if(q.k=='text')return h+'<input type="text" data-id="'+q.id+'" value="'+esc(A[q.id]||'')+'">';
 if(q.k=='long')return h+'<textarea data-id="'+q.id+'">'+esc(A[q.id]||'')+'</textarea>';
 if(q.k=='scale'){return h+'<div class="scale">'+['😟','🙁','😐','🙂','😍'].map((e,i)=>'<button class="opt'+(A[q.id]==i+1?' on':'')+'" data-id="'+q.id+'" data-v="'+(i+1)+'">'+e+'</button>').join('')+'</div><div class="ends"><span>'+T(q.lo)+'</span><span>'+T(q.hi)+'</span></div>'}
 const m=q.k=='multi';
 return h+'<div class="opts">'+q.o.map((o,i)=>{const on=m?(A[q.id]||[]).includes(i):A[q.id]===i;return '<button class="opt'+(on?' on':'')+(m?' m':'')+'" data-id="'+q.id+'" data-i="'+i+'" data-m="'+(m?1:0)+'">'+T(o)+'</button>'}).join('')+'</div>'}
function readable(){const r=[];S.forEach(s=>s.qs.forEach(q=>{let v=A[q.id];if(!has(v))return;if(q.k=='one')v=T(q.o[v]);else if(q.k=='multi')v=v.map(i=>T(q.o[i])).join('، ');r.push([T(q.q),String(v)])}));return r}
function car(){const p=step<0?0:step>=S.length?100:pct(),f=lang=='ar',c=$('#car');c.style.left='calc((100% - 150px) * '+((f?100-p:p)/100)+')';c.style.transform=f?'scaleX(-1)':'none'}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 $('#lang').textContent=T(UI.lang);$('#about').textContent=T(UI.about);car();
 const w=$('#win');
 if(aboutOpen){w.innerHTML='<div class="card"><div class="hd"><div><b>'+T(UI.aboutT)+'</b></div></div><div class="ill">'+ILL[2]+'</div><div class="bd"><p>'+T(UI.aboutP)+'</p></div><div class="ft"><span></span><button class="pill g" id="cl">'+T(UI.close)+'</button></div></div>'}
 else if(step<0){w.innerHTML='<div class="hero"><h1>WATHEERA</h1><p>'+T(UI.tag)+'</p><button class="go" id="go">'+T(UI.start)+'</button></div>'}
 else if(step<S.length){const s=S[step];
  w.innerHTML='<div class="card"><div class="hd">'+ring(pct())+'<div><small>'+T(UI.cp)+' '+(step+1)+'/'+S.length+'</small><b>'+T(s.t)+'</b></div></div><div class="ill">'+ILL[step]+'</div><div class="bd">'+(step==0?'<p><b>'+T(UI.hi)+'</b> '+T(UI.consent)+'</p>':'')+s.qs.map(qHTML).join('')+'</div><div class="ft">'+(step?'<button class="pill w" id="bk">'+T(UI.back)+'</button>':'<span></span>')+'<button class="pill g" id="nx"'+(valid(step)?'':' disabled')+'>'+T(step==S.length-1?UI.send:UI.next)+'</button></div></div>'}
 else{w.innerHTML='<div class="card"><div class="hd g">'+ring(100)+'<div><small>'+T(UI.arr)+'</small><b>'+T(UI.doneH)+'</b></div></div><div class="ill">'+ILL[1]+'</div><div class="bd"><p>'+T(UI.doneP)+'</p>'+(sent?'<p class="note">'+T(sent=='ok'?UI.saved:UI.fail)+'</p>':'')+(sent=='fail'?'<button class="pill w" id="dl">'+T(UI.dl)+'</button>':'')+(showAns?'<ul class="ans">'+readable().map(r=>'<li><b>'+esc(r[0])+'</b><br>'+esc(r[1])+'</li>').join('')+'</ul>':'')+'</div><div class="ft"><button class="pill w" id="va">'+T(UI.view)+'</button><button class="pill g" id="sh">'+T(UI.share)+'</button></div></div>'}
 bind()}
function bind(){
 document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{const id=el.dataset.id;
  if(el.dataset.v)A[id]=+el.dataset.v;
  else if(el.dataset.m=='1'){const a=A[id]||[],i=+el.dataset.i;A[id]=a.includes(i)?a.filter(x=>x!=i):[...a,i]}
  else A[id]=+el.dataset.i;
  const y=$('.bd').scrollTop;render();$('.bd').scrollTop=y});
 document.querySelectorAll('input[type=text],textarea').forEach(el=>el.oninput=()=>{A[el.dataset.id]=el.value;const n=$('#nx');if(n)n.disabled=!valid(step)});
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#go',()=>{step=0;render()});
 on('#nx',()=>{if(step==S.length-1)submit();else{step++;render()}});
 on('#bk',()=>{step--;render()});
 on('#cl',()=>{aboutOpen=false;render()});
 on('#va',()=>{showAns=!showAns;render()});
 on('#sh',()=>{const u=location.href;if(navigator.share)navigator.share({title:'WATHEERA',url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).catch(()=>{})});
 on('#dl',async()=>{try{const d=await claude.use('downloads');if(d)await d.save({filename:'watheera-answers.json',data:JSON.stringify({lang,answers:A},null,2)})}catch(e){}})}
async function submit(){
 const rec={ts:new Date().toISOString(),lang,answers:A};step=S.length;sent=null;render();
 try{const db=await claude.use('db');if(!db)throw 0;
  await db.collection('responses').doc(Date.now().toString(36)+Math.random().toString(36).slice(2,7)).set(rec);sent='ok'}catch(e){sent='fail'}
 render()}
$('#lang').onclick=()=>{lang=lang=='ar'?'en':'ar';render()};
$('#about').onclick=()=>{aboutOpen=true;render()};
render();
</script>
